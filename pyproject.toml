[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heywtf"
version = "0.1.0"
description = "AI-powered terminal assistant with multiple backends: Ollama, OpenAI, Gemini, ChatGPT web, and web relay"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["terminal", "cli", "ai", "assistant", "ollama", "chatgpt", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
chatgpt-web = ["playwright>=1.40.0"]
openai = ["openai>=1.0.0"]
gemini = ["google-generativeai>=0.5.0"]

[project.scripts]
heywtf = "source.cli:main"
hey = "source.cli:hey_main"
buddy-diagnose = "source.cli:buddy_diagnose_main"

[tool.setuptools.packages.find]
include = ["source*"]

[tool.setuptools.package-data]
source = ["../shell/*.zsh"]
