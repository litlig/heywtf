[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heywtf"
version = "0.2.0"
description = "AI-powered terminal assistant — ask anything or diagnose failures with 'hey wtf'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["terminal", "cli", "ai", "assistant", "ollama", "llm", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
]

[project.scripts]
heywtf = "heywtf.cli:main"
hey = "heywtf.cli:hey_main"
buddy-diagnose = "heywtf.cli:buddy_diagnose_main"

[tool.setuptools.packages.find]
include = ["heywtf*"]

[tool.setuptools.package-data]
heywtf = ["shell/*.zsh"]
